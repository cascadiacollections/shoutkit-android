Categories:
  - Radio
  - Online Media Player
  - Multimedia
License: GPL-3.0-only
AuthorName: Cascadia Collections
WebSite: https://cascadiacollections.github.io/shoutkit-android/
SourceCode: https://github.com/cascadiacollections/shoutkit-android
IssueTracker: https://github.com/cascadiacollections/shoutkit-android/issues
Changelog: https://github.com/cascadiacollections/shoutkit-android/releases

AutoName: ShoutKit

AntiFeatures:
  NonFreeNet:
    en-US: Album artwork is looked up through Apple's iTunes Search API. It is on
      by default and can be turned off in Settings.

RepoType: git
Repo: https://github.com/cascadiacollections/shoutkit-android.git
Binaries: https://github.com/cascadiacollections/shoutkit-android/releases/download/v%v/shoutkit-android-%v.apk

Builds:
  - versionName: 1.3.1
    versionCode: 512
    commit: a89fdefba8ee4f51dfcb227ab0051d07f91a5b51
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    gradle:
      - foss
    rm:
      - cast
      - wear
      - benchmark
    prebuild:
      - sed -i -e '/include(":cast")/d' -e '/include(":wear")/d' -e '/include(":benchmark")/d'
        ../settings.gradle.kts
      - sed -i -e '/libs.plugins.google.services/d' -e '/libs.plugins.firebase.crashlytics/d'
        ../build.gradle.kts build.gradle.kts
      - sed -i -e '/dynamicFeatures/d' -e '/"playImplementation"/d' build.gradle.kts

AllowedAPKSigningKeys: REPLACE_WITH_RELEASE_CERTIFICATE_SHA256

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: 1.3.1
CurrentVersionCode: 512
