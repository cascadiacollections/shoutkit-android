<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Shoutkit social card source</title>
<!-- Source for assets/social.png. Not linked from the site. Render at exactly
     1200x630 with headless Chromium, for example with Playwright:
     page.set_viewport_size(1200x630); page.goto(".../social-card.html"); page.screenshot() -->
<link rel="stylesheet" href="style.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:1fr 330px;align-items:center;gap:40px;padding:0 70px}
h1{font-size:76px;margin:16px 0 18px}
p.eyebrow{font-size:20px}
.promise{font-size:26px;color:var(--muted);margin:0}
.phone{width:270px;transform:rotate(4deg);margin-top:40px}
</style>
</head>
<body>
<div>
<p class="eyebrow">Shoutkit</p>
<h1>Free internet radio.<span>No ads, no account, no&nbsp;tracking.</span></h1>
<p class="promise">Open source · Android and iPhone</p>
</div>
<div class="phone"><img src="assets/listen.webp" alt="" width="1080" height="2400"></div>
</body>
</html>
