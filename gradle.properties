# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Gradle Daemon JVM flags (OpenJDK 21+, G1GC).
# 6 GB max heap: CI builds every variant in one invocation (--parallel, three R8 runs,
# lint, tests) on 16 GB GitHub Linux runners. Capping Metaspace prevents unbounded growth
# across long-lived local daemon sessions.
org.gradle.jvmargs=-Xms1g -Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 \
    -XX:+UseG1GC \
    -XX:MaxGCPauseMillis=200 \
    -XX:+UseStringDeduplication \
    -XX:+ParallelRefProcEnabled \
    -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compile daemon runs in a separate JVM and would otherwise inherit org.gradle.jvmargs.
# Capped at 3 GB so Gradle (6 GB) + Kotlin (3 GB) leave headroom for R8 and test workers on 16 GB CI.
kotlin.daemon.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 \
    -XX:+UseG1GC \
    -XX:MaxGCPauseMillis=200 \
    -XX:+UseStringDeduplication \
    -XX:+ParallelRefProcEnabled

# Enable parallel execution, build cache, configuration cache, and VFS watching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enable Kotlin incremental compilation
kotlin.incremental=true
# Namespaced R classes per library module for smaller APKs and faster incremental builds
android.nonTransitiveRClass=true
# Enable R8 full mode for aggressive code shrinking and optimization
android.enableR8.fullMode=true
