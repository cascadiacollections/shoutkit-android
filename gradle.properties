# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# Optimized for Eclipse Adoptium Temurin JDK 17+ with G1GC and modern JVM flags
# 6 GB, raised from 4 GB on 2026-11-24. CI builds every variant in one invocation
# (--parallel, three R8 runs, lint, tests), and on #342 that ran out of heap twice in one
# push: once dexing material-icons-extended in the build job, once in CodeQL's autobuild,
# which reads this file too. GitHub's hosted Linux runners have 16 GB.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 \
    -XX:+UseG1GC \
    -XX:MaxGCPauseMillis=200 \
    -XX:+UseStringDeduplication \
    -XX:+ParallelRefProcEnabled \
    -XX:+HeapDumpOnOutOfMemoryError
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# The Kotlin compile daemon is a second JVM and would otherwise inherit the Gradle heap
# above. Capped so the two together leave room for test workers on a 16 GB runner.
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
# Enable Gradle build caching for faster incremental builds
org.gradle.caching=true
# Enable configuration cache for faster configuration phase
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enable Kotlin incremental compilation
kotlin.incremental=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Enable R8 full mode for aggressive code shrinking and optimization
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
