name: Release APK

# On a v* tag: build the FOSS APK signed with the release key and attach it to that tag's
# GitHub release. F-Droid's recipe points `Binaries:` at this file and, because the build
# is reproducible, ships it with this signature instead of F-Droid's own. Without the
# release key secrets the job warns and attaches nothing, so tagging never fails on them.
#
# Secrets (repository or `release` environment):
#   RELEASE_KEYSTORE_BASE64    base64 of the release .jks
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release and upload the APK
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - name: Release key present?
        id: key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set: no signed APK is attached to this release"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          # versionCode is `git rev-list --count HEAD`, so the build needs full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: steps.key.outputs.present == 'true'
        with:
          # No tool cache in a release job: a cache written by another ref could poison it.
          cache: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.key.outputs.present == 'true'
        with:
          # A release must come from a clean build, not a cache another branch wrote.
          cache-disabled: true
      - name: Install Android SDK platform
        if: steps.key.outputs.present == 'true'
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Restore the release key
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed FOSS APK
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease --no-daemon --no-build-cache
      - name: Verify and name it
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          apk="dist/shoutkit-android-${TAG#v}.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          # The certificate digest is what F-Droid's AllowedAPKSigningKeys must list.
          "$apksigner" verify --print-certs "$apk"
          "$aapt2" dump badging "$apk" | head -1
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - name: Attest build provenance
        if: steps.key.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - name: Attach to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Shoutkit ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
