name: Release APK

# On a v* tag: build the FOSS APK signed with the release key and attach it to that tag's
# GitHub release. F-Droid builds and signs its own copy of this foss flavor
# (com.cascadiacollections.sir.foss). That package installs separately from Play
# (com.cascadiacollections.sir). This job does not publish to F-Droid. Without the
# release key secrets the job warns and attaches nothing, so tagging never fails on them.
#
# Secrets (repository or `release` environment):
#   RELEASE_KEYSTORE_BASE64    base64 of the release .jks
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release and upload the APK
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - name: Release key present?
        id: key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set: no signed APK is attached to this release"
            echo "Skipped: RELEASE_KEYSTORE_BASE64 is not set, so no signed APK was built or attached. Add the RELEASE_* secrets and re-run this job." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.key.outputs.present == 'true'
        with:
          # No tool cache in a release job: a cache written by another ref could poison it.
          cache: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.key.outputs.present == 'true'
        with:
          # A release must come from a clean build, not a cache another branch wrote.
          cache-disabled: true
      - name: Install Android SDK platform
        if: steps.key.outputs.present == 'true'
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Restore the release key
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed FOSS APK
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease --no-daemon --no-build-cache
      - name: Verify and name it
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          apk="dist/shoutkit-android-${TAG#v}.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          # Confirm the APK is signed before it is attached to the GitHub release.
          "$apksigner" verify --print-certs "$apk"
          badging=$("$aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          # The release is named from the tag, which has to match versionName.
          # F-Droid's checkupdates reads that same versionName from app/build.gradle.kts
          # at this tag, then builds and signs its own package.
          name=$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if [ "$name" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG doesn't match versionName '$name' in app/build.gradle.kts"
            exit 1
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - name: Attest build provenance
        if: steps.key.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - name: Attach to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ShoutKit ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
