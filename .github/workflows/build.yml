name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      checks: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${ANDROID_HOME}/platforms/android-37.0" ]; then
            yes | $SDKMANAGER "platforms;android-37.0"
          fi

      # Robolectric downloads its android-all jars lazily from the test JVMs, and
      # parallel test tasks fetching them at once has failed CI ("Failed to fetch
      # maven artifact org.robolectric:android-all-instrumented"). Cache them per
      # Robolectric version and fetch any missing ones up front, once, with retries.
      # Keep the list in sync with the SDK levels used in @Config(sdk = [...]).
      - name: Read Robolectric version
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric SDKs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-sdks-${{ steps.robolectric.outputs.version }}

      - name: Pre-fetch Robolectric SDKs
        run: |
          versions=(
            "12.1-robolectric-8229987-i7" # API 32
            "14-robolectric-10818077-i7"  # API 34
          )
          for version in "${versions[@]}"; do
            for attempt in 1 2 3; do
              mvn --batch-mode --quiet dependency:get \
                -Dartifact="org.robolectric:android-all-instrumented:${version}" \
                -Dtransitive=false && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 10))
            done
          done

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          echo "KEYSTORE_PATH=/tmp/release.jks" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Static analysis (detekt + ktlint + Compose rules)
        run: ./gradlew detekt --no-daemon --continue

      - name: Build, Lint, and Test
        run: ./gradlew assemblePlayRelease assembleFossRelease assemblePlayDebug bundlePlayRelease lintPlayDebug :wear:lintDebug testPlayDebugUnitTest testFossDebugUnitTest :wear:testDebugUnitTest :core:model:testDebugUnitTest :core:directory:testDebugUnitTest :core:playback:testDebugUnitTest :core:persistence:testDebugUnitTest :core:artwork:testDebugUnitTest jacocoTestReport --no-daemon --parallel --build-cache
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Findings show up as PR annotations and under Security > Code scanning.
      - name: Upload detekt SARIF
        if: ${{ !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload Android Lint SARIF (app + core/libs)
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-playDebug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: app/build/reports/lint-results-playDebug.sarif
          category: lint-app

      - name: Upload Android Lint SARIF (wear)
        if: ${{ !cancelled() && hashFiles('wear/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: wear/build/reports/lint-results-debug.sarif
          category: lint-wear

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      - name: Coverage Threshold
        run: |
          REPORT=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if [ ! -f "$REPORT" ]; then echo "JaCoCo report not found at $REPORT - verify test execution completed successfully"; exit 1; fi
          LINE_COUNTER=$(grep -o 'type="LINE" missed="[0-9]*" covered="[0-9]*"' "$REPORT" | tail -1)
          MISSED=$(echo "$LINE_COUNTER" | sed 's/.*missed="\([0-9]*\)".*/\1/')
          COVERED=$(echo "$LINE_COUNTER" | sed 's/.*covered="\([0-9]*\)".*/\1/')
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then echo "No line coverage data found in JaCoCo report - verify tests are executing code paths"; exit 1; fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Line coverage: ${PCT}% (${COVERED}/${TOTAL})"
          if [ "$PCT" -lt 5 ]; then echo "::error::Coverage ${PCT}% is below 5% threshold"; exit 1; fi

      - name: APK & AAB Size
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/play/release/app-play-release-unsigned.apk app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk app/build/outputs/apk/play/debug/app-play-debug.apk app/build/outputs/bundle/play/release/app-play-release.aab; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "| $(basename $f) | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-${{ github.sha }}
          path: |
            app/build/reports/lint-results-playDebug*.html
            wear/build/reports/lint-results-debug*.html
            build/reports/detekt/
            */build/reports/detekt/
            */*/build/reports/detekt/
          retention-days: 7

      # Upload APK artifacts (legacy sideload support)
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/play/release/app-play-release-unsigned.apk
            app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
            app/build/outputs/apk/play/debug/app-play-debug.apk
          retention-days: 1

      # Upload AAB artifact (Play Store distribution)
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aab-${{ github.sha }}
          path: app/build/outputs/bundle/play/release/app-play-release.aab
          retention-days: 1

  deploy-internal:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read

    steps:
      - name: Download AAB Artifact
        uses: actions/download-artifact@v8
        with:
          name: aab-${{ github.sha }}
          path: aab
        continue-on-error: true

      - name: Upload to Play Store internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cascadiacollections.sir
          releaseFiles: aab/play/release/app-play-release.aab
          track: internal
          status: completed
        # No-ops gracefully if PLAY_SERVICE_ACCOUNT_JSON secret is not yet configured
        continue-on-error: true
