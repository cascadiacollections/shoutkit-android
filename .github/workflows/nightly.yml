name: Nightly APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  # Pushes to main already build every merged commit, so a scheduled run
  # only rebuilds when main has moved since the last successful nightly.
  # Commits by github-actions[bot] (generated files) do not count. Any API
  # error falls through to a build.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          build=true
          if [ -n "$last" ]; then
            new=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA" --jq 'if .status == "identical" or .status == "ahead" then [.commits[] | select(.author.login != "github-actions[bot]")] | length else -1 end' || echo -1)
            if [ "$new" = "0" ]; then build=false; fi
            echo "last successful nightly: $last; new commits: $new"
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.build != 'false' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK platform
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Restore persistent nightly signing key
        env:
          NIGHTLY_KEYSTORE: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NIGHTLY_KEYSTORE" || { echo '::error::NIGHTLY_KEYSTORE_BASE64 is required'; exit 1; }
          printf '%s' "$NIGHTLY_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nightly.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nightly.jks" >> "$GITHUB_ENV"
      - name: Build signed FOSS APK and run unit tests
        run: ./gradlew :app:assembleFossRelease :app:testFossDebugUnitTest --no-daemon --build-cache
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/shoutkit-android-nightly.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose dist/shoutkit-android-nightly.apk
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Explicit result check: `changes` is skipped on push, which would
    # otherwise skip this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-apk
          path: dist
      # SLSA build provenance for the APK. Check a download with
      # `gh attestation verify shoutkit-android-nightly.apk --repo <this repo>`,
      # or offline against the attached .sigstore.json bundle.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/shoutkit-android-nightly.apk
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/shoutkit-android-nightly.apk.sigstore.json
      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Latest main ($GITHUB_SHA). Signed FOSS APK for sideloading. Uses a persistent nightly key; updating an existing store or locally signed installation may require uninstalling it first."
          tag="nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nightly Build ($GITHUB_RUN_ID)" --notes "$notes" --prerelease --latest=false
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          test "$draft" = "false"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'shoutkit-android-nightly.apk'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'shoutkit-android-nightly.apk.sigstore.json'
      # Keep the 10 newest nightly prereleases and delete the rest with their
      # tags. Only `nightly-*` prereleases are touched, never a stable release.
      # A failed delete warns instead of failing the run.
      - name: Prune old nightly prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          set -euo pipefail
          current="nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Sort by publishedAt: a release's createdAt is its target commit's
          # date, so a re-run of an old commit would sort as old.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName,isPrerelease,publishedAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"nightly-\")))] | sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName" |
          while read -r old; do
            if [ "$old" = "$current" ]; then continue; fi
            echo "Deleting $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "::warning::Could not delete $old"
          done
      - name: Point the site at this nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/shoutkit-android-nightly.apk"
          notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/publish-nightly-link.py --html docs/index.html --apk-url "$apk_url" --notes-url "$notes_url"
          if ! git diff --quiet -- docs/index.html; then
            git add docs/index.html
            git commit -m "ci: point nightly download at ${tag} [skip ci]"
            if ! git push origin HEAD:main; then
              echo "::warning::Could not push the download link to main. GitHub Pages will still be updated."
              git reset --hard origin/main
            fi
          fi
          git fetch origin gh-pages
          git worktree add --detach /tmp/gh-pages origin/gh-pages
          python3 .github/scripts/publish-nightly-link.py --html /tmp/gh-pages/index.html --apk-url "$apk_url" --notes-url "$notes_url"
          git -C /tmp/gh-pages add index.html
          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "GitHub Pages already points at ${tag}"
          else
            git -C /tmp/gh-pages commit -m "ci: point nightly download at ${tag} [skip ci]"
            git -C /tmp/gh-pages push origin HEAD:gh-pages
          fi
          {
            echo "### Nightly download"
            echo
            echo "Resolved URL: ${apk_url}"
            echo
            echo "Notes: ${notes_url}"
          } >> "$GITHUB_STEP_SUMMARY"
