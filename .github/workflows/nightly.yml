name: Nightly APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install Android SDK platform
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Restore persistent nightly signing key
        env:
          NIGHTLY_KEYSTORE: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NIGHTLY_KEYSTORE" || { echo '::error::NIGHTLY_KEYSTORE_BASE64 is required'; exit 1; }
          printf '%s' "$NIGHTLY_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nightly.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nightly.jks" >> "$GITHUB_ENV"
      - name: Build signed FOSS APK and run unit tests
        run: ./gradlew :app:assembleFossRelease :app:testFossDebugUnitTest --no-daemon --build-cache
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/shoutkit-android-nightly.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose dist/shoutkit-android-nightly.apk
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-apk
          path: dist
      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Latest main ($GITHUB_SHA). Signed FOSS APK for sideloading. Uses a persistent nightly key; updating an existing store or locally signed installation may require uninstalling it first."
          tag="nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nightly Build ($GITHUB_RUN_ID)" --notes "$notes" --prerelease --latest=false
