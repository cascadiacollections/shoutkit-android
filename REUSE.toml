# Machine-readable licensing for REUSE (https://reuse.software). Check with `reuse lint`.
#
# Mirrors README.md's "License" section: the app modules (:app, :cast, :wear, :benchmark) and
# anything else without its own LICENSE file are GPL-3.0; :core:*, :libs:* and build-logic are
# MIT. LICENSE and the per-module LICENSE files stay authoritative; LICENSES/ holds copies of
# the texts for REUSE. A later annotation that matches a path wins over an earlier one.
#
# The GPL-3.0 parts also carry the additional permission under GPL-3.0 section 7 in
# LICENSE-EXCEPTION.md (app store distribution). SPDX has no identifier for a project-specific
# exception (`WITH LicenseRef-...` is not valid SPDX, and REUSE rejects SPDX 3 AdditionRef-), so
# the expressions below say GPL-3.0-only and that file states the permission.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Cascadia Collections"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["core/**", "libs/**", "build-logic/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Cascadia Collections"
SPDX-License-Identifier = "MIT"

# Simplified Chinese translation (#138), contributed under MIT. It keeps its MIT terms inside
# the GPL-3.0 app.
[[annotations]]
path = "app/src/main/res/values-zh-rCN/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Cascadia Collections and contributors"
SPDX-License-Identifier = "MIT"

# Gradle wrapper, generated by `gradle wrapper` and checked in unmodified (Apache-2.0, as the
# SPDX header in gradlew and gradlew.bat says).
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar", "gradle/wrapper/gradle-wrapper.properties"]
precedence = "override"
SPDX-FileCopyrightText = "the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# The section 7 additional permission that applies to every GPL-3.0-only path above. reuse
# treats LICENSE* files as license texts and skips them, so this entry only records it.
[[annotations]]
path = "LICENSE-EXCEPTION.md"
precedence = "override"
SPDX-FileCopyrightText = "Cascadia Collections"
SPDX-License-Identifier = "GPL-3.0-only"
